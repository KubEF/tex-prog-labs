site:
  title: Введение в технологии программирования
  url: https://kubef.github.io/tex-prog-linux-lab/
content:
  sources:
    - url: ./.
ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ui
antora:
  extensions:
